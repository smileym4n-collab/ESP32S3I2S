[platformio]
src_dir = main
default_envs = esp32s3_48k

[env]
platform = platformio/espressif32
framework = espidf
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 921600

; This is still ESP-IDF firmware, not Arduino. PlatformIO/VS Code is only
; the build, flash, and monitor front-end.
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Fill these in before flashing your custom board.
; Example:
;   -DAUDIO_PIN_BCLK=4
;   -DAUDIO_PIN_WS=5
;   -DAUDIO_PIN_DATA=6
build_flags =
    -DAUDIO_PIN_BCLK=-1
    -DAUDIO_PIN_WS=-1
    -DAUDIO_PIN_DATA=-1

[env:esp32s3_48k]

[env:esp32s3_96k]
build_flags =
    ${env.build_flags}
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults.96k"

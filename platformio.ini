[platformio]
src_dir = main
default_envs = n8r8_audio_test
boards_dir = boards

; Current assembled module: 8 MB flash plus octal PSRAM. This firmware does
; not initialize PSRAM and never configures GPIO35-39, allowing safe USB/I2S
; core testing without driving the GPIO35-37 octal-PSRAM connections.
[env:n8r8_audio_test]
platform = platformio/espressif32
framework = espidf
board = esp32-s3-n8
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
build_flags =
    -DAUDIO_PIN_BCLK=4
    -DAUDIO_PIN_WS=5
    -DAUDIO_PIN_DATA=6
    -DBOARD_STATUS_OUTPUTS_ENABLE=0

; Future ESP32-S3-WROOM-1U-N8 module: no octal PSRAM, so GPIO35-39 can drive
; MUTE and F3/F2/F1/F0 using the same application source.
[env:esp32s3_n8]
platform = platformio/espressif32
framework = espidf
board = esp32-s3-n8
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
build_flags =
    -DAUDIO_PIN_BCLK=4
    -DAUDIO_PIN_WS=5
    -DAUDIO_PIN_DATA=6
    -DBOARD_STATUS_OUTPUTS_ENABLE=1

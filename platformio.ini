[platformio]
src_dir = main
default_envs = esp32s3_audio
boards_dir = boards

[env:esp32s3_audio]
platform = platformio/espressif32
framework = espidf
board = esp32-s3-n16r8
monitor_speed = 115200
upload_speed = 921600

; This is still ESP-IDF firmware, not Arduino. PlatformIO/VS Code is only
; the build, flash, and monitor front-end.
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb.csv

; Fill these in before flashing your custom board.
; Keep the -D prefix, but make the value itself positive. For GPIO 4 use
; -DAUDIO_PIN_BCLK=4, not -DAUDIO_PIN_BCLK=-4.
; Example:
;   -DAUDIO_PIN_BCLK=4
;   -DAUDIO_PIN_WS=5
;   -DAUDIO_PIN_DATA=6
build_flags =
    -DAUDIO_PIN_BCLK=4
    -DAUDIO_PIN_WS=5
    -DAUDIO_PIN_DATA=6
